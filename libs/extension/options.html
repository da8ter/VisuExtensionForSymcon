<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title data-i18n="extName"></title>
<style>
  :root { --fg: #1d1d1f; --bg: #fff; --muted: #6e6e73; --line: #d2d2d7; --surface: #f5f5f7; --akzent: #00a88d; --rot: #d70015; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #1c1c1e; --muted: #98989d; --line: #48484a; --surface: #2c2c2e; --akzent: #00cdab; --rot: #ff6961; } }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; color: var(--fg); background: var(--bg); }
  h1 { font-size: 21px; margin: 0 0 4px; }
  p { margin: 8px 0; }
  .muted { color: var(--muted); }
  form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin: 20px 0 6px; }
  .feld { flex: 1 1 150px; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .feld.breit { flex-basis: 100%; }
  input { min-width: 0; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  button { padding: 8px 16px; border: 0; border-radius: 10px; font: inherit; font-weight: 650; cursor: pointer; background: var(--surface); color: inherit; }
  button.primary { background: var(--akzent); color: #fff; }
  #meldung { min-height: 22px; color: var(--rot); }
  #liste { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
  .zeile { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); }
  .zeile .haupt { flex: 1; min-width: 0; }
  .zeile .name { font-weight: 650; overflow-wrap: anywhere; }
  .zeile .ort, .zeile .status { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .zeile .status.ok { color: var(--akzent); }
  .zeile .status.fehler { color: var(--rot); }
  h2 { font-size: 17px; margin: 28px 0 4px; }
  .schalter { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-weight: 650; }
  .schalter input { width: 18px; height: 18px; }
  .leer { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 14px; text-align: center; }
</style>
</head>
<body>
<h1 data-i18n="extName"></h1>
<p class="muted" data-i18n="optIntro"></p>
<ol class="muted"><li data-i18n="optStep1"></li><li data-i18n="optStep2"></li><li data-i18n="optStep3"></li></ol>
<form id="neu">
  <label class="feld breit"><span data-i18n="optAddress"></span>
    <input id="adresse" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="optPlaceholder"></label>
  <label class="feld"><span data-i18n="optCode"></span>
    <input id="code" type="text" inputmode="numeric" spellcheck="false" autocomplete="off" maxlength="9" placeholder="123 456"></label>
  <label class="feld"><span data-i18n="optName"></span>
    <input id="name" type="text" maxlength="40" autocomplete="off" data-i18n-placeholder="optNamePlaceholder"></label>
  <button class="primary" type="submit" data-i18n="optAdd"></button>
</form>
<div id="meldung" role="alert"></div>
<div id="liste"></div>
<p class="muted" data-i18n="optReload"></p>
<h2 data-i18n="camTitle"></h2>
<p class="muted" data-i18n="camIntro"></p>
<label class="schalter"><input id="kamera" type="checkbox"> <span data-i18n="camAllow"></span></label>
<div id="kameraStatus" class="muted" role="status"></div>
<p class="muted" data-i18n="optTrust"></p>
<script src="core.js"></script>
<script src="register.js"></script>
<script src="options.js"></script>
</body>
</html>
